name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: |
          npx newman run postman/practice-software-testing.postman_collection.json \
            --folder "05 - Integration" \
            --env-var "base_url=https://api.practicesoftwaretesting.com" \
            --env-var "login_email=${{ secrets.LOGIN_EMAIL }}" \
            --env-var "login_password=${{ secrets.LOGIN_PASSWORD }}"